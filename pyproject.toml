[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram-mcp"
version = "0.1.0"
description = "Self-hosted Telegram tools for MCP agents"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.26,<2",
  "pydantic>=2.10,<3",
  "starlette>=0.40,<1",
  "telethon>=1.42,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
telegram-mcp = "telegram_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_mcp"]
