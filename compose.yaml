services:
  telegram-mcp:
    image: ghcr.io/duby67/telegrammcp:latest
    env_file: .env
    environment:
      TELEGRAM_SESSION_DIR: /data
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    ports:
      - "127.0.0.1:${MCP_PORT:-8000}:8000"
    volumes:
      - telegram-session:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  telegram-session:
